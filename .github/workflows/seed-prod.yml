name: Seed production reference data

# 13 §7: manual, workflow_dispatch-only — never runs on a push/PR, and requires the
# operator to type the literal confirmation string so this can't be triggered by accident.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED-PROD to confirm you want to run this against the production database'
        required: true

jobs:
  seed-prod:
    if: github.event.inputs.confirm == 'SEED-PROD'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed:prod
