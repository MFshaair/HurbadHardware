name: CI / Deploy

# CI/CD pipeline template for the Hurbad Electronics platform. Not yet
# wired to a live Vercel project/token (no external secrets configured) —
# ops must add VERCEL_TOKEN, VERCEL_ORG_ID, and per-region
# VERCEL_PROJECT_ID_* secrets in the GitHub repo settings before this can
# deploy anything. See docs/DEPLOYMENT.md.
#
# The `test` job currently runs lint/typecheck/build/Prisma-validate only
# — it does NOT run the full `npm test` chain (that needs a live Postgres
# instance; wiring a `postgres:` service container into this job is
# tracked as an open item under FEATURES.md M0-7).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build

  deploy-kenya:
    name: Deploy — Kenya (primary)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (KE)
        run: npx vercel deploy --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_KE }}

  # Ethiopia and Somalia deploy jobs follow the same shape as deploy-kenya
  # once those Vercel projects are provisioned (PRD Unit 14, Sprint 9-10 —
  # see FEATURES.md) — duplicate the job above with VERCEL_PROJECT_ID_ET
  # / VERCEL_PROJECT_ID_SO and the corresponding region env file.
