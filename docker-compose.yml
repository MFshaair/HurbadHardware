services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hurbad
      POSTGRES_PASSWORD: hurbad
      POSTGRES_DB: hurbad
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hurbad']
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: hurbad
      POSTGRES_PASSWORD: hurbad
      POSTGRES_DB: hurbad_test
    ports: ['5433:5432']
    tmpfs: ['/var/lib/postgresql/data']
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes:
  pgdata:
