<!-- Paste this whole block inside <helmet> of every artboard. Do not edit per artboard; add page-specific rules in a second <style> after it. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{--p:#ff7417;--p-press:#d95f0e;--p-deep:#b84d05;--p-soft:#ffe8d6;--p-tint:#fff4eb;--on-p:#1a0c02;
    --ink:#0f0f10;--ink2:#3d3d42;--ink3:#6f6f78;--ink4:#a2a2aa;--od:#f7f5f0;--od2:#b9b6ad;--od3:#7d7b74;
    --night:#0a0a0b;--night2:#141416;--night3:#1d1d21;--cream:#fbfaf6;--soft:#f4f2ec;--light:#ffffff;
    --hl:#e6e3db;--hl2:#d6d2c7;--hld:#26262b;--hld2:#333339;
    --ok:#157347;--ok-s:#d7f5e3;--warn:#9a5b00;--warn-s:#fff0c2;--bad:#b3261e;--bad-s:#fde3e1;--info:#1f4fbf;--info-s:#e3ebfb;
    --wa:#25d366;--mpesa:#3cb44b;--evc:#1a9bd7;
    --fd:"Sora","Helvetica Neue",Arial,sans-serif;--fb:"DM Sans","Helvetica Neue",Arial,sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --sh1:0 1px 2px rgba(15,15,16,.06),0 4px 12px rgba(15,15,16,.06);
    --sh2:0 8px 8px rgba(0,0,0,.06),0 4px 4px rgba(0,0,0,.06),0 2px 2px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.06);
    --sh3:0 25px 50px -12px rgba(15,15,16,.25);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--ink);text-decoration:none} a:hover{color:var(--p-deep)}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .display{font-family:var(--fd);font-weight:300;letter-spacing:-.03em;line-height:1.02}
  .h{font-family:var(--fd);font-weight:400;letter-spacing:-.01em;line-height:1.2}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)}
  .mono{font-family:var(--fm);font-size:13px;font-weight:500}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:9999px;font:600 15px/1 var(--fb);border:1px solid transparent;cursor:pointer;white-space:nowrap}
  .btn-lg{height:48px;padding:0 26px;font-size:16px}
  .btn-sm{height:36px;padding:0 16px;font-size:14px}
  .btn-p{background:var(--p);color:var(--on-p)}
  .btn-ink{background:var(--ink);color:var(--od)}
  .btn-o{background:var(--light);color:var(--ink);border-color:var(--ink)}
  .btn-od{background:transparent;color:var(--od);border-color:var(--od)}
  .btn-g{background:transparent;color:var(--ink2)}
  .btn-wa{background:var(--wa);color:var(--ink)}
  .btn-icon{width:44px;padding:0}
  .input{height:44px;padding:0 14px;border:1px solid var(--hl2);border-radius:10px;background:var(--light);font:400 15px var(--fb);color:var(--ink);display:flex;align-items:center;gap:10px}
  .input .ph{color:var(--ink3)}
  .input.focus{outline:2px solid var(--p);outline-offset:2px}
  .input.err{border-color:var(--bad)}
  .label{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:block}
  .help{font-size:13px;color:var(--ink3)}
  .card{background:var(--light);border:1px solid var(--hl);border-radius:14px}
  .card-n{background:var(--night2);border:1px solid var(--hld);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:var(--od)}
  .tag{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:500;background:var(--soft);color:var(--ink2)}
  .tag-p{background:var(--p-soft);color:var(--p-deep)}
  .pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:600}
  .pill-ok{background:var(--ok-s);color:var(--ok)} .pill-warn{background:var(--warn-s);color:var(--warn)} .pill-bad{background:var(--bad-s);color:var(--bad)} .pill-info{background:var(--info-s);color:var(--info)} .pill-n{background:var(--soft);color:var(--ink2)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .hr{height:1px;background:var(--hl)}
  .container{width:1280px;margin:0 auto;padding:0 32px}
  .nav{display:flex;align-items:center;gap:32px;height:64px;padding:0 32px}
  .nav-links{display:flex;gap:24px;font-weight:500;font-size:14px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--fb);font-weight:700;font-size:17px;letter-spacing:.6px;text-transform:uppercase;color:var(--p);line-height:1}
  .logo .mk{width:32px;height:32px;border-radius:7px;background:var(--p);display:grid;grid-template-columns:4px 9px 4px;align-items:center;justify-content:center;flex:none}
  .logo .mk i{display:block;height:20px;background:#fff;border-radius:1px}
  .logo .mk b{display:block;height:4px;background:#fff}
  .logo span{font-weight:300;color:var(--ink);letter-spacing:2.6px;font-size:12px;margin-left:2px}
  .product{background:var(--light);border:1px solid var(--hl);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .product .img{aspect-ratio:1;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;position:relative}
  .product .name{font:500 15px/1.3 var(--fd);letter-spacing:-.01em}
  .price{font-family:var(--fd);font-weight:500;font-size:20px;letter-spacing:-.2px;font-feature-settings:"tnum"}
  .price-lg{font-family:var(--fd);font-weight:400;font-size:32px;letter-spacing:-.6px;font-feature-settings:"tnum";line-height:1}
  .strike{font-size:13px;color:var(--ink3);text-decoration:line-through;font-feature-settings:"tnum"}
  .table{width:100%;border-collapse:collapse}
  .table th{background:var(--soft);font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);text-align:left;padding:12px 16px;border-bottom:1px solid var(--hl)}
  .table td{padding:0 16px;height:48px;border-bottom:1px solid var(--hl);font-size:14px;font-feature-settings:"tnum"}
  .table .r{text-align:right}
  .fab{position:absolute;right:32px;bottom:32px;width:56px;height:56px;border-radius:9999px;background:var(--wa);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh2)}
  .ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .ico-sm{width:16px;height:16px}
  .photo{background:radial-gradient(120% 90% at 50% 40%,#2a2a2f 0%,#141416 60%,#0a0a0b 100%)}
  .mat{background:var(--soft)}
  .device{border-radius:18px;background:linear-gradient(160deg,#3a3a40,#17171a);box-shadow:0 20px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
  .laptop{border-radius:10px;background:linear-gradient(160deg,#d9d7d0,#a8a6a0)}
  .footer{background:var(--night);color:var(--od2);padding:64px 32px 32px}
  .footer h4{color:var(--od);font:600 13px var(--fb);margin:0 0 14px}
  .footer a{color:var(--od2);font-size:14px;display:block;margin-bottom:10px}
  .footer a:hover{color:var(--od)}
  .side{width:240px;background:var(--night);color:var(--od2);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
  .side .item{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:500;border-left:3px solid transparent}
  .side .item.on{background:var(--night3);color:var(--od);border-left-color:var(--p)}
  .side .grp{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--od3);padding:16px 12px 6px}
  .topbar{height:56px;border-bottom:1px solid var(--hl);background:var(--light);display:flex;align-items:center;gap:16px;padding:0 24px}
  .kpi{background:var(--light);border:1px solid var(--hl);border-radius:14px;padding:20px}
  .kpi .v{font-family:var(--fd);font-weight:400;font-size:28px;letter-spacing:-.5px;font-feature-settings:"tnum"}
  .steps{display:flex;gap:0;align-items:center}
  .step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink3)}
  .step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--hl2);display:flex;align-items:center;justify-content:center;font-size:12px}
  .step.done .n{background:var(--ink);border-color:var(--ink);color:var(--od)}
  .step.on{color:var(--ink)} .step.on .n{border-color:var(--p);background:var(--p);color:var(--on-p)}
  .step-line{width:40px;height:1px;background:var(--hl2);margin:0 10px}
  .pay{display:flex;align-items:center;gap:14px;height:64px;padding:0 16px;border:1px solid var(--hl);border-radius:12px;background:var(--light)}
  .pay.on{border:2px solid var(--p);background:var(--p-tint)}
  .pay .glyph{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 11px var(--fb);background:var(--soft);color:var(--ink2)}
  .pay.on .glyph{color:#fff}
  .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--hl2);margin-left:auto}
  .pay.on .radio{border:6px solid var(--p);background:#fff}
  .tl{display:flex;flex-direction:column;position:relative}
  .tl .ev{display:flex;gap:16px;padding-bottom:22px;position:relative}
  .tl .ev:before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:2px;background:var(--hl)}
  .tl .ev:last-child:before{display:none}
  .tl .d{width:12px;height:12px;border-radius:50%;background:var(--ink);flex:none;margin-top:4px}
  .tl .ev.now .d{background:var(--p);box-shadow:0 0 0 4px var(--p-soft)}
  .tl .ev.next .d{background:var(--hl2)}
  .tl .ev.next{color:var(--ink3)}
  .otp{display:flex;gap:10px}
  .otp i{width:52px;height:60px;border:1px solid var(--hl2);border-radius:10px;background:var(--light);display:flex;align-items:center;justify-content:center;font:500 24px var(--fd);font-style:normal}
  .otp i.on{outline:2px solid var(--p);outline-offset:2px}
  .bottombar{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--light);border-top:1px solid var(--hl);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .announce{height:36px;background:var(--ink);color:var(--od);font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
